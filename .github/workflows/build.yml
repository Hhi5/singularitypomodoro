name: Build Release Executable

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Build Windows Release Binary
    runs-on: windows- [ "main", "master" ]

jobs:
  build-windows:
    name: Build Windows Release Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release --verbose

      - name: Verify executable existence
        shell: pwsh
        run: |
          if (Test-Path "target/release/singularity.exe") {
            Write-Host "Build successful: target/release/singularity.exe found."
          } else {
            Write-Error "Binary not found!"
            exit 1
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: singularity-windows-x64
          path: target/release/singularity.exe
          if-no-files-found: error
